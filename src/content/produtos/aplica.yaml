status: rascunho
subtitulo: Método visual de análise e aplicação de questões de Química do ENEM.
proposta: Um método para compreender questões do ENEM e aprender a resolver novos desafios.
descricao_curta: >-
  Método visual com análise de 50 questões de Química do ENEM de 2023, 2024 e 2025
  e 50 desafios autorais com resolução.
descricao: >-
  Aprenda a analisar uma questão do ENEM e a aplicar o raciocínio em uma nova situação.
  O QUIMICAR APLICA conduz você da leitura das pistas à compreensão dos conceitos, à
  tentativa de um desafio autoral e à revisão do próprio caminho de resolução.
