indicacao: Quem quer aprender a interpretar questões reais do ENEM e aplicar o raciocínio em situações novas.
sequencia_de_uso:
  - Analise a questão-base no Raio-X.
  - Compreenda a ciência envolvida.
  - Tente o desafio sem consultar a resolução.
  - Compare o seu raciocínio com a Resolução Inteligente e revise.
