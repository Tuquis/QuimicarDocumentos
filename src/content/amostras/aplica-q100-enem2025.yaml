questao_base:
  identificacao: "Questão 100 · ENEM 2025 · Caderno Amarelo"
  texto_resumido: >-
    A quantidade de CO₂ na atmosfera da Terra aumentou em 50%, e a temperatura está
    cerca de 1,2 °C mais quente em comparação ao século XIX. Os países precisam enfrentar
    as mudanças climáticas com ações mitigadoras, que reduzam tanto as emissões quanto
    os níveis de CO₂ na atmosfera.
  fonte: "Um guia rápido para entender as mudanças climáticas. Disponível em: www.bbc.com. Acesso em: 6 dez. 2021 (adaptado). Texto resumido."
  pergunta: Qual ação mitigadora auxilia na remoção desse gás presente na atmosfera, reduzindo seus níveis?
  alternativas:
    - { letra: A, texto: Plantar mais árvores. }
    - { letra: B, texto: Instalar mais usinas eólicas. }
    - { letra: C, texto: Ampliar o uso de energia solar. }
    - { letra: D, texto: Manter os combustíveis fósseis no solo. }
    - { letra: E, texto: Produzir menos resíduos sólidos urbanos. }
  metodo:
    - { etapa: VISUALIZE, texto: "Encontre “remoção desse gás”." }
    - { etapa: ENTENDA, texto: "O alvo é o CO₂ que já está no ar." }
    - { etapa: CONECTE, texto: "A fotossíntese fixa carbono na biomassa." }
    - { etapa: APLIQUE, texto: "Separe remoção de emissões evitadas." }
    - { etapa: ACERTE, texto: "Plantar árvores: alternativa A." }
  nao_confunda: "Eólica, solar e redução do uso de fósseis ajudam principalmente a evitar emissões; isso não é a mesma função solicitada."
desafio:
  selo: "Questão autoral QUIMICAR · inspirada na Questão 100 do ENEM 2025"
  enunciado:
    - >-
      Uma fábrica produz blocos utilizando resíduos de concreto. Durante a cura, o material
      é colocado em uma câmara por onde circula ar enriquecido com dióxido de carbono.
      Parte desse gás reage com compostos de cálcio presentes no resíduo, conforme a equação:
  equacao: "Ca(OH)<sub>2</sub>(s) + CO<sub>2</sub>(g) → CaCO<sub>3</sub>(s) + H<sub>2</sub>O(l)"
  pergunta: "Nesse processo, ocorre remoção de CO₂ da corrente gasosa porque"
  alternativas:
    - letra: A
      texto: impede que os blocos absorvam radiação infravermelha.
      feedback: A equação não mostra alteração na absorção de radiação pelos blocos. Isso não explica o consumo de CO₂.
      hipotese: Confira se confundiu efeito estufa com o destino do carbono.
    - letra: B
      texto: incorpora o carbono do gás a um composto sólido.
      feedback: "Correta: o C do CO₂(g) integra o CaCO₃(s). Há retirada de CO₂ da corrente tratada e incorporação ao sólido."
      hipotese: null
    - letra: C
      texto: transforma o dióxido de carbono em oxigênio molecular.
      feedback: O₂ não é produto da reação. Os produtos indicados são CaCO₃ e H₂O; remoção não exige formar O₂.
      hipotese: Veja se supôs que toda remoção exige formar O₂.
    - letra: D
      texto: mantém o carbono no estado gasoso dentro da câmara.
      feedback: "Apenas manter o gás na câmara não explica esta reação: parte do CO₂ é consumida e seu carbono passa ao sólido."
      hipotese: Confira se ignorou o consumo do reagente.
    - letra: E
      texto: diminui apenas o consumo energético da fabricação.
      feedback: O enunciado não demonstra economia energética. Mesmo que ocorresse, ela não explicaria a retirada química de CO₂.
      hipotese: Veja se trocou remoção por economia de energia.
  gabarito: B
  feedback_correta: "Isso! O carbono do CO₂ passa a integrar o CaCO₃ sólido."
  resolucao:
    - etapa: VISUALIZE
      texto: "Encontre “remoção de CO₂ da corrente gasosa”. Na equação, identifique CO₂(g) entre os reagentes e CaCO₃(s) entre os produtos."
    - etapa: ENTENDA
      texto: "Explique por que a reação retira CO₂ do gás tratado. Não basta apontar uma possível economia de energia."
    - etapa: CONECTE
      texto: "O carbono se conserva nas reações: não desaparece. Ele pode passar de uma substância gasosa para um composto sólido."
    - etapa: APLIQUE
      texto: "Acompanhe o C: CO₂(g) → CaCO₃(s). O reagente gasoso é consumido e seu carbono é incorporado ao carbonato."
    - etapa: ACERTE
      texto: "Escolha B: há incorporação do carbono a um sólido. Confira se a alternativa explica a remoção, e não apenas uma vantagem ambiental."
  nao_confunda:
    titulo: "Não confunda: remoção e emissão evitada"
    texto: "Retirar CO₂ de um gás é diferente de impedir que ele seja emitido. Aqui, a evidência decisiva é o consumo de CO₂ na reação."
