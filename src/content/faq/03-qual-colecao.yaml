pergunta: Qual coleção escolher?
resposta: >-
  O CONECTA organiza conceitos com mapas e demonstra sua aplicação em questões comentadas.
  O APLICA é um método de estudo que analisa questões reais do ENEM, aprofunda os conceitos
  e orienta a prática em desafios autorais com resolução explicada. O COMPLETO reúne as duas coleções.
ordem: 3
exibir_na_lp: true
